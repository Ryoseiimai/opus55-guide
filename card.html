<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#F5F7F9; --ink:#1B2430; --accent:#1F6F8B;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{width:1200px; height:675px; overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif;
  word-break:auto-phrase; line-break:strict;
}
.card{
  width:1200px; height:675px;
  display:flex; align-items:center;
  padding:0 70px;
  gap:50px;
}
.left{flex:1; display:flex; flex-direction:column; gap:22px}
.eyebrow{font-size:20px; letter-spacing:.12em; color:var(--accent); font-weight:700; font-family:"Zen Kaku Gothic New",sans-serif}
h1{
  font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:900; font-size:56px; line-height:1.3;
  text-wrap:balance;
}
.sub{font-size:22px; color:#56606D; line-height:1.6}
.points{display:flex; flex-direction:column; gap:12px; margin-top:8px}
.point{
  display:flex; align-items:flex-start; gap:12px;
  font-size:21px; line-height:1.6;
}
.point .dot{
  width:10px; height:10px; border-radius:50%;
  background:var(--accent); margin-top:10px; flex-shrink:0;
}
.right{
  width:320px; flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.qrbox{
  background:#fff; padding:24px; border-radius:16px;
  border:1px solid #D9DEE4;
}
.qrbox img{width:260px; height:260px; display:block}
.urltext{font-size:16px; color:#56606D; text-align:center}
.hint{font-size:15px; color:var(--accent); font-weight:700; text-align:center; font-family:"Zen Kaku Gothic New",sans-serif}
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="eyebrow">やさしい解説</div>
    <h1>Opus 5.5 の<br>じょうずな頼み方</h1>
    <p class="sub">公式ブログの要点を、非エンジニア向けに<br>実例つきで</p>
    <div class="points">
      <div class="point"><span class="dot"></span><span>仕事は小出しにせず、まとめて渡す</span></div>
      <div class="point"><span class="dot"></span><span>「よく考えて」は書かなくていい</span></div>
      <div class="point"><span class="dot"></span><span>終わったら「あなた待ち」から読む</span></div>
    </div>
  </div>
  <div class="right">
    <div class="qrbox"><img src="qr.png"></div>
    <div class="urltext">ryoseiimai.github.io/opus55-guide/</div>
    <div class="hint">スマホで読み取って全文へ</div>
  </div>
</div>
</body>
</html>
